<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teşekkürler | Medine</title>
  <style>
    body {
      background: #1d2223;
      color: #f2f7f4;
      font-family: Inter, sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #293132;
      border: 1px solid rgba(169, 232, 199, 0.18);
      padding: 40px;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      max-width: 450px;
    }
    h1 { color: #a9e8c7; margin-bottom: 15px; }
    p { color: #a7b4af; margin-bottom: 25px; }
    a {
      background: #a9e8c7;
      color: #17221d;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 750;
    }
    a:hover { background: #c1f2d8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Mesajınız Alındı!</h1>
    <p>Benimle iletişime geçtiğiniz için teşekkür ederim. En kısa sürede dönüş yapacağım.</p>
    <a href="index.html">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
